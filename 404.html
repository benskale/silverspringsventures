<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found - Silver Springs Ventures</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Geist:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #F8F6F2;
    --ink: #1C1C1C;
    --ink-2: #4A4A4A;
    --ink-3: #8A8580;
    --accent: #A0522D;
    --line: #E5E0D8;
  }

  body {
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px;
  }

  .container {
    max-width: 480px;
    text-align: left;
  }

  .code {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 72px;
    font-weight: 600;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 8px;
    font-variation-settings: 'opsz' 144;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 28px;
    font-weight: 500;
    line-height: 1.2;
    margin-bottom: 16px;
    letter-spacing: -0.5px;
  }

  p {
    font-size: 16px;
    color: var(--ink-2);
    line-height: 1.6;
    margin-bottom: 32px;
  }

  a {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    font-size: 15px;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 2px;
    transition: opacity 0.15s;
  }

  a:hover { opacity: 0.7; }

  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 2px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>This page doesn't exist.</h1>
    <p>The page you're looking for may have moved or never existed. Head back to the homepage to learn what we build.</p>
    <a href="/">Back to silverspringsventures.com &rarr;</a>
  </div>
</body>
</html>
